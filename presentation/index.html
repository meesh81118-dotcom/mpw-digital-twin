<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPW Gasification Complex – Live Presentation</title>
<meta name="description" content="Live 3D presentation of the MPW gasification plant for methanol and hydrogen in Jubail Industrial City">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080d;--ink:#f3f6f9;--mut:#9fb0c1;--acc:#f0a35e;--acc2:#ffd29b;--line:rgba(255,255,255,.14);--card:rgba(7,11,17,.86);--f:'Inter',system-ui,sans-serif;--fd:'Montserrat','Inter',sans-serif;--fm:'JetBrains Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
#labels>*{position:absolute;left:0;top:0;display:none}#labels>.on{display:block;animation:fin .35s ease both}@keyframes fin{from{opacity:0}to{opacity:1}}
#shade{position:fixed;inset:0;z-index:5;pointer-events:none;background:linear-gradient(90deg,rgba(3,6,10,.55),rgba(3,6,10,0) 38%),linear-gradient(0deg,rgba(3,6,10,.55),rgba(3,6,10,0) 22%),linear-gradient(180deg,rgba(3,6,10,.6),rgba(3,6,10,0) 14%)}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:18px;padding:16px 22px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand svg{width:34px;height:34px}.brand b{display:block;font:800 13px var(--fd);letter-spacing:.22em}.brand small{display:block;font:600 10.5px var(--f);letter-spacing:.18em;color:var(--mut);margin-top:3px}
#chap{margin-left:auto;font:600 11px var(--fd);letter-spacing:.24em;text-transform:uppercase;color:var(--acc2)}
.tb{display:flex;gap:6px}
.tb button{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:rgba(8,12,18,.72);cursor:pointer;font:600 12px var(--f);transition:background .2s,border-color .2s}
.tb button:hover{border-color:rgba(255,255,255,.4)}.tb button.on{background:rgba(240,163,94,.22);border-color:rgba(240,163,94,.65)}
.tb svg{width:15px;height:15px}
/* text card */
#card{position:fixed;left:clamp(16px,3.2vw,52px);top:96px;z-index:8;width:min(430px,calc(100vw - 32px));pointer-events:none}
#card .in{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px 20px;transform:translateY(10px);opacity:0;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
#card.on .in{opacity:1;transform:none}
#card.globe{top:auto;bottom:112px}#card.globe .in{background:transparent;border-color:transparent;box-shadow:none;padding:0}
#card .k{font:700 11px var(--fd);letter-spacing:.26em;text-transform:uppercase;color:var(--acc)}
#card h1{font:800 clamp(26px,2.6vw,40px)/1.06 var(--fd);margin:10px 0 12px;letter-spacing:.003em}
#card.globe h1{font-size:clamp(34px,4.4vw,64px);text-shadow:0 4px 40px rgba(0,0,0,.6)}
#card p{font:400 15px/1.6 var(--f);color:#d4dee8;margin:0}#card p b{color:#fff;font-weight:600}
#card.globe p{font-size:clamp(15px,1.2vw,18px);max-width:620px;text-shadow:0 2px 16px rgba(0,0,0,.8)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px}
.stat b{display:block;font:700 clamp(20px,1.9vw,28px)/1 var(--fd);white-space:nowrap}.stat b u{text-decoration:none;font:600 12px var(--f);color:var(--acc2);margin-left:4px}
.stat>span{display:block;margin-top:6px;font:500 12px var(--f);color:var(--mut);max-width:170px}
.bars{margin-top:16px}.bar{display:grid;grid-template-columns:170px minmax(0,1fr) 38px;gap:10px;align-items:center;font:500 12.5px var(--f);margin:7px 0}
.bar .t{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.bar .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1.3s cubic-bezier(.2,.7,.2,1) .3s}
.bar b{font:600 12.5px var(--fm);text-align:right}
.b2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;font:500 12.5px var(--f);margin:9px 0}
.b2 .tt{position:relative;height:18px}.b2 .tt i,.b2 .tt s{position:absolute;left:0;height:7px;border-radius:3px;width:0;transition:width 1.3s cubic-bezier(.2,.7,.2,1) .3s}
.b2 .tt i{top:0;background:rgba(255,255,255,.28)}.b2 .tt s{top:10px;background:linear-gradient(90deg,#ff6a3d,var(--acc2))}
.b2 em{grid-column:2;font:500 11.5px var(--fm);font-style:normal;color:var(--mut)}
.steps{display:flex;gap:6px;margin-top:16px}.steps i{width:28px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .4s}.steps i.on{background:var(--acc)}
#spark{display:block;margin-top:16px;width:100%}
/* unit panel */
#panel{position:fixed;top:84px;right:20px;bottom:104px;width:min(380px,calc(100vw - 40px));z-index:9;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .5s cubic-bezier(.2,.75,.2,1)}
#panel.on{transform:none}#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
#panel .sec{font:700 10.5px var(--fd);letter-spacing:.26em;text-transform:uppercase}
#panel h3{font:800 21px/1.2 var(--fd);margin:8px 0 8px}#panel .role{color:#cdd8e3;font-size:13.5px;line-height:1.55;margin:0 0 12px}
#panel .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 12px}
#panel .kp div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;padding:9px}
#panel .kp b{display:block;font:700 17px/1.1 var(--fd)}#panel .kp b u{text-decoration:none;font:600 10.5px var(--f);color:var(--acc2);margin-left:3px}#panel .kp div>span{display:block;font-size:11px;color:var(--mut);margin-top:4px}#panel .kp b span{display:inline}
#panel dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);border-top:1px solid var(--line)}
#panel dt,#panel dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.8px}#panel dt{color:var(--mut);padding-right:10px}#panel dd{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
#panel .x{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer}
#panel .chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}#panel .chips button{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font:600 11.5px var(--f)}
#panel .chips button.on{background:rgba(240,163,94,.22);border-color:rgba(240,163,94,.6)}
#panel .nav{display:flex;gap:8px;margin-top:14px}#panel .nav button{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font:600 12px var(--f)}
#panel table{width:100%;border-collapse:collapse;font-size:12px}#panel td{padding:5px 4px;border-bottom:1px solid var(--line)}#panel td:first-child{font:700 12px var(--fm)}#panel tr{cursor:pointer}#panel tr:hover td{background:rgba(255,255,255,.05)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* labels */
.tag{transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer}
.tag .p{display:flex;align-items:center;gap:6px;font:700 11px var(--fd);letter-spacing:.1em;padding:5px 9px;border-radius:7px;background:rgba(6,10,16,.84);border:1px solid rgba(255,255,255,.22);white-space:nowrap}
.tag .p i{width:7px;height:7px;border-radius:50%;background:var(--c,#f0a35e)}.tag .s{width:1px;height:20px;margin:auto;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0))}
.tag:hover .p,.tag.sel .p{background:#f0a35e;color:#111;border-color:#fff}
.st{transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer}
.st b{display:grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:6px;transform:rotate(45deg);background:rgba(6,10,16,.88);border:1.5px solid var(--c);}
.st b span{transform:rotate(-45deg);font:700 10.5px var(--fm);color:#fff}
.co{transform:translate(0,-50%)}
.co .box{position:absolute;top:0;transform:translateY(-50%);background:rgba(6,10,16,.88);border:1px solid rgba(255,210,155,.45);border-radius:9px;padding:7px 10px;font:500 11.5px/1.35 var(--f);color:#dbe5ee;white-space:nowrap}
.co .box b{display:block;font:700 12px var(--fd);color:#ffd29b;letter-spacing:.02em}
.co .ln{position:absolute;top:0;height:1px;background:rgba(255,210,155,.7)}.co .dt{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#ffd29b;box-shadow:0 0 0 3px rgba(255,210,155,.25)}
.geo{transform:translate(-50%,-50%);pointer-events:none;font:700 12px var(--fd);letter-spacing:.24em;text-transform:uppercase;color:#fff;text-shadow:0 2px 12px #000;white-space:nowrap}
.geo.on{}.geo.big{font-size:clamp(15px,1.5vw,22px);letter-spacing:.3em}.geo.sea{font-style:italic;color:#bfe9ff;font-weight:600}
.pin{pointer-events:none}
.pin .d{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(240,163,94,.3),0 0 22px var(--acc)}
.pin.sm .d{left:-4px;top:-4px;width:8px;height:8px;background:#fff;box-shadow:none}
.pin .r{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--acc);animation:ping 2s infinite}
.pin .n{position:absolute;left:14px;top:-10px;font:700 12px var(--fd);letter-spacing:.12em;white-space:nowrap;text-shadow:0 2px 10px #000}.pin .n small{display:block;font:500 11px var(--f);letter-spacing:.05em;color:var(--acc2)}
.loop{transform:translate(-14px,-50%);align-items:center;gap:9px;pointer-events:none}#labels>.loop.on{display:flex}
.loop .c{position:relative;width:28px;height:28px;border-radius:50%;background:#fff;color:#0b1220;font:800 10px var(--fd);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(91,177,255,.85)}
.loop .c:after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid #5bb1ff;animation:ping 2.2s infinite}
.loop .t{background:rgba(6,10,16,.86);border:1px solid rgba(91,177,255,.45);border-radius:9px;padding:6px 10px}.loop .t b{display:block;font:800 12px var(--fd);letter-spacing:.06em;color:#9fd0ff}.loop .t span{display:block;font:500 11.5px var(--f);color:#dbe6f1;white-space:nowrap}
@keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(3.2);opacity:0}}
#tip{position:fixed;z-index:20;pointer-events:none;background:rgba(6,10,16,.94);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:500 12px/1.45 var(--f);opacity:0;transition:opacity .15s;max-width:300px}
#tip b{color:#ffd29b}
/* bottom */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:14px;padding:16px 22px 18px}
.nb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(8,12,18,.78);cursor:pointer;display:grid;place-items:center;flex:none}.nb:hover{border-color:rgba(255,255,255,.45)}.nb svg{width:18px;height:18px}
#dots{flex:1;display:flex;gap:5px;align-items:center}#dots button{flex:1;height:22px;border:0;background:none;cursor:pointer;padding:0;position:relative}
#dots button:before{content:'';position:absolute;left:0;right:0;top:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .3s}
#dots button.done:before{background:rgba(240,163,94,.55)}#dots button.on:before{background:var(--acc);height:4px;top:9px}
#dots button:after{content:attr(data-t);position:absolute;bottom:24px;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 11px var(--f);background:rgba(6,10,16,.94);border:1px solid var(--line);padding:4px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s}
#dots button:hover:after{opacity:1}
#num{font:600 12px var(--fm);color:var(--mut);min-width:54px;text-align:right}
#attr{position:fixed;right:22px;bottom:70px;z-index:7;font:500 10px var(--f);color:rgba(255,255,255,.55);opacity:0;transition:opacity .6s}#attr.on{opacity:1}
#qr{position:fixed;right:28px;top:50%;z-index:9;transform:translate(130%,-50%);transition:transform .7s cubic-bezier(.2,.75,.2,1);background:#fff;border-radius:18px;padding:16px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#qr.on{transform:translate(0,-50%)}#qr img{width:200px;height:200px;display:block;image-rendering:pixelated}#qr span{display:block;font:700 11px var(--fm);color:#0b1220;margin-top:8px}
#fade{position:fixed;inset:0;z-index:4;pointer-events:none;background:#000;opacity:0;transition:opacity .5s}
/* loader */
#loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#0c1622,#04070b);transition:opacity .9s}
#loader.off{opacity:0;pointer-events:none}
#loader .w{text-align:center;max-width:620px;padding:24px}
#loader h2{font:800 clamp(26px,3.4vw,44px)/1.1 var(--fd);margin:18px 0 8px;letter-spacing:.01em}#loader p{color:var(--mut);margin:0 0 26px;font-size:15px}
#lbar{width:min(420px,80vw);height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin:0 auto;overflow:hidden}#lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
#lst{font:500 12px var(--fm);color:var(--mut);margin-top:12px;min-height:16px}
#start{margin-top:22px;padding:13px 30px;border-radius:999px;border:0;background:linear-gradient(90deg,#f0a35e,#ffd29b);color:#111;font:800 13px var(--fd);letter-spacing:.16em;cursor:pointer;opacity:.35;pointer-events:none;transition:opacity .4s}
#start.on{opacity:1;pointer-events:auto}
#hint{font:500 12px var(--f);color:var(--mut);margin-top:18px}
@media (max-width:820px){#card{top:auto;bottom:86px}#card .in{padding:16px 18px}#card h1{font-size:24px}#card p{font-size:13.5px}.stats{gap:14px}#panel{top:auto;bottom:80px;height:48vh;right:8px;width:calc(100vw - 16px)}.brand small,#chap,.tb .lb{display:none}#top{padding:12px}#bottom{padding:10px 12px 12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas><div id="fade"></div><div id="shade"></div><div id="labels"></div>
<header id="top">
  <button class="brand" id="home" title="Back to the first slide"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0c1c2c"/><path d="M32 10 51 21v22L32 54 13 43V21z" fill="none" stroke="#f3b27f" stroke-width="4"/><circle cx="32" cy="32" r="7" fill="#f3b27f"/></svg>
    <span><b>MPW GASIFICATION</b><small>HYDROGEN · METHANOL · JUBAIL</small></span></button>
  <div id="chap"></div>
  <div class="tb">
    <button id="bExplore" title="Free camera (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg><span class="lb">Explore</span></button>
    <button id="bStreams" title="Show all streams (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h8l3 5h7M3 17h6l3-5"/></svg><span class="lb">Streams</span></button>
    <button id="bLabels" class="on" title="Labels (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9-9-9z"/><circle cx="8" cy="8" r="1.5"/></svg><span class="lb">Labels</span></button>
    <button id="bAuto" title="Autoplay (space)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l11-7z"/></svg><span class="lb">Auto</span></button>
    <button id="bFull" title="Full screen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>
<section id="card"><div class="in" id="cardIn"></div></section>
<aside id="panel"><button class="x" id="pClose" title="Close (Esc)">✕</button><div id="pBody"></div></aside>
<div id="qr"><img src="assets/qr.png" alt="QR code to the digital twin"><span>meesh81118-dotcom.github.io/mpw-digital-twin</span></div>
<div id="attr">Imagery © Esri, Maxar, Earthstar Geographics</div>
<footer id="bottom">
  <button class="nb" id="prev" title="Previous (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 5-7 7 7 7"/></svg></button>
  <div id="dots"></div><div id="num"></div>
  <button class="nb" id="next" title="Next (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 5 7 7-7 7"/></svg></button>
</footer>
<div id="tip"></div>
<div id="loader"><div class="w">
  <svg viewBox="0 0 64 64" width="56" height="56"><rect width="64" height="64" rx="14" fill="#0c1c2c"/><path d="M32 10 51 21v22L32 54 13 43V21z" fill="none" stroke="#f3b27f" stroke-width="4"/><circle cx="32" cy="32" r="7" fill="#f3b27f"/></svg>
  <h2>MPW Gasification for the<br>Production of Methanol and H₂</h2>
  <p>A live tour from orbit to the plant in Jubail Industrial City</p>
  <div id="lbar"><i></i></div><div id="lst">Loading…</div>
  <button id="start">START THE TOUR</button>
  <div id="hint">← → to move · click any unit · E to explore · F for full screen</div>
</div></div>
<script type="module" src="main.js"></script>
</body>
</html>
