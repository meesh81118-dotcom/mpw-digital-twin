<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MPW Gasification Complex – Live Presentation</title>
<meta name="description" content="Live 3D presentation of the mixed-plastic-waste gasification plant for hydrogen and methanol in Jubail Industrial City, Saudi Arabia.">
<meta name="theme-color" content="#05080d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef3f8;--mut:#9fb0c2;--dim:#6d7e90;--acc:#f0a35e;--acc2:#ffd38a;--glass:rgba(9,14,22,.58);--line:rgba(255,255,255,.14);--ok:#7bd389;
 --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--fd:"Montserrat","Inter",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05080d;color:var(--ink);font:16px/1.5 var(--f)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;z-index:7}#labels>*{position:absolute;left:0;top:0}
button{font:inherit;color:inherit}
/* loader */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(1200px 600px at 50% 40%,#0d1a2b,#04070b);transition:opacity 1.2s}
#loader.off{opacity:0;pointer-events:none}
#loader .b{text-align:center}
#loader .lg{font:800 13px var(--fd);letter-spacing:.5em;color:var(--acc);text-transform:uppercase}
#loader h1{font:800 clamp(28px,4vw,54px)/1.05 var(--fd);margin:14px 0 26px;letter-spacing:.02em}
#loader .bar{width:min(420px,70vw);height:2px;background:rgba(255,255,255,.12);margin:0 auto;border-radius:2px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
#loader .st{margin-top:14px;font:500 12px var(--fm);color:var(--mut);letter-spacing:.08em}
#start{margin-top:30px;padding:14px 30px;border-radius:40px;border:1px solid rgba(240,163,94,.6);background:rgba(240,163,94,.12);font:700 14px var(--fd);letter-spacing:.24em;text-transform:uppercase;cursor:pointer;opacity:0;transform:translateY(8px);transition:.5s}
#start.on{opacity:1;transform:none}#start:hover{background:rgba(240,163,94,.25)}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:16px;padding:16px 22px;background:linear-gradient(180deg,rgba(3,6,10,.75),rgba(3,6,10,0));pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:34px;height:34px}
.brand b{display:block;font:800 13px var(--fd);letter-spacing:.24em;text-transform:uppercase}
.brand small{display:block;font:500 11px var(--f);letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
#chaps{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
#chaps button{background:none;border:0;padding:6px 9px;font:600 11.5px var(--f);letter-spacing:.06em;color:var(--mut);cursor:pointer;border-radius:6px;text-transform:uppercase;transition:.25s}
#chaps button:hover{color:#fff;background:rgba(255,255,255,.07)}#chaps button.on{color:#fff;background:rgba(240,163,94,.18)}
.tb{display:flex;gap:6px}
.ib{height:36px;min-width:36px;padding:0 11px;display:inline-flex;align-items:center;gap:7px;border-radius:10px;border:1px solid var(--line);background:rgba(8,13,20,.5);backdrop-filter:blur(10px);cursor:pointer;font:600 12px var(--f);letter-spacing:.05em;transition:.2s}
.ib:hover{border-color:rgba(255,255,255,.35)}.ib.on{background:rgba(240,163,94,.22);border-color:rgba(240,163,94,.6)}
.ib svg{width:16px;height:16px}
@media (max-width:1250px){#chaps{display:none}}
/* slide text */
#lt{position:fixed;left:clamp(18px,4vw,64px);bottom:120px;z-index:8;max-width:min(720px,88vw);pointer-events:none}
#lt .k{font:700 12px var(--fd);letter-spacing:.32em;text-transform:uppercase;color:var(--acc)}
#lt h2{font:800 clamp(30px,4.4vw,62px)/1.02 var(--fd);margin:10px 0 14px;letter-spacing:.005em;text-shadow:0 4px 40px rgba(0,0,0,.6)}
#lt p{font:400 clamp(15px,1.25vw,19px)/1.55 var(--f);color:#d6e0ea;margin:0;max-width:640px;text-shadow:0 2px 18px rgba(0,0,0,.8)}
#lt p b{color:#fff;font-weight:600}
#lt .rule{width:64px;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin:18px 0}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.stat b{display:block;font:700 clamp(24px,2.4vw,36px)/1 var(--fd);letter-spacing:-.01em}
.stat b u{text-decoration:none;font:600 14px var(--f);color:var(--acc2);margin-left:5px;letter-spacing:0}
.stat>span{display:block;margin-top:6px;font:500 12.5px var(--f);color:var(--mut);letter-spacing:.04em;max-width:180px}
.bars{margin-top:20px;display:grid;gap:10px;max-width:520px}
.bar{display:grid;grid-template-columns:200px minmax(0,1fr) 46px;gap:12px;align-items:center;font:500 13.5px var(--f)}
.bar .t{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}.bar .t i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.bar b{font:700 14px var(--fm);text-align:right}
.bar2{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:12px;align-items:center;font:500 13px var(--f);margin:8px 0}
.bar2 .tt{position:relative;height:22px}
.bar2 .tt i{position:absolute;left:0;top:0;height:10px;border-radius:3px;background:rgba(255,255,255,.28);transition:width 1.4s}
.bar2 .tt s{position:absolute;left:0;top:12px;height:10px;border-radius:3px;background:linear-gradient(90deg,#ff7a59,var(--acc2));transition:width 1.6s .4s}
.bar2 em{font:500 12px var(--fm);color:var(--mut);font-style:normal;white-space:nowrap}
.rv{opacity:0;transform:translateY(16px);filter:blur(6px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1),filter .9s}
.rv.in{opacity:1;transform:none;filter:none}
/* unit panel */
#panel{position:fixed;top:84px;right:22px;bottom:110px;width:min(430px,92vw);z-index:9;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;overflow:auto;transform:translateX(120%);transition:transform .7s cubic-bezier(.2,.75,.2,1);box-shadow:0 30px 80px rgba(0,0,0,.45)}
#panel.on{transform:none}
#panel .sec{font:700 11px var(--fd);letter-spacing:.28em;text-transform:uppercase}
#panel h3{font:800 25px/1.15 var(--fd);margin:8px 0 10px}
#panel .role{color:#cfdae5;font-size:14.5px;margin:0 0 14px}
#panel .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}
#panel .kp div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px}
#panel .kp b{display:block;font:700 19px/1.1 var(--fd)}#panel .kp b u{text-decoration:none;font:600 11px var(--f);color:var(--acc2);margin-left:3px}
#panel .kp span{display:block;font-size:11.5px;color:var(--mut);margin-top:4px}
#panel dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);border-top:1px solid var(--line)}
#panel dt,#panel dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
#panel dt{color:var(--mut);padding-right:10px}#panel dd{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
#panel .x{position:absolute;top:14px;right:14px}
#panel .nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#panel .nav button{flex:1 1 auto;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font:600 12.5px var(--f)}
#panel .nav button:hover{border-color:rgba(255,255,255,.4)}
#panel .units{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
#panel .units button{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font:600 12px var(--f)}
#panel .units button.on{background:rgba(240,163,94,.22);border-color:rgba(240,163,94,.6)}
/* bottom */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:16px 22px 18px;display:flex;align-items:center;gap:14px;background:linear-gradient(0deg,rgba(3,6,10,.75),rgba(3,6,10,0))}
#dots{flex:1;display:flex;gap:6px;align-items:center}
#dots button{flex:1;height:22px;border:0;background:none;cursor:pointer;position:relative;padding:0}
#dots button::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:rgba(255,255,255,.18);border-radius:2px;transition:.3s}
#dots button.done::before{background:rgba(240,163,94,.55)}
#dots button.on::before{background:var(--acc);height:4px;top:9px;box-shadow:0 0 14px rgba(240,163,94,.7)}
#dots button:hover::after{content:attr(data-t);position:absolute;bottom:26px;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 11px var(--f);background:rgba(0,0,0,.7);padding:4px 8px;border-radius:6px;letter-spacing:.04em}
#num{font:600 13px var(--fm);color:var(--mut);min-width:60px;text-align:center}
.arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(8,13,20,.55);backdrop-filter:blur(10px);cursor:pointer;display:grid;place-items:center;transition:.2s}
.arrow:hover{border-color:var(--acc);background:rgba(240,163,94,.15)}.arrow svg{width:18px;height:18px}
#hint{position:fixed;right:22px;bottom:84px;z-index:8;font:500 12px var(--f);color:var(--mut);letter-spacing:.04em;pointer-events:none;transition:opacity .6s}
/* labels */
.lab{transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .5s}
.lab.on{opacity:1}
.lab .p{font:700 11.5px var(--fd);letter-spacing:.12em;padding:5px 9px;border-radius:7px;background:rgba(6,10,16,.72);border:1px solid rgba(255,255,255,.2);white-space:nowrap;backdrop-filter:blur(6px);transition:.2s;display:flex;align-items:center;gap:7px}
.lab .p i{width:7px;height:7px;border-radius:50%;background:var(--c,#f0a35e);box-shadow:0 0 10px var(--c,#f0a35e)}
.lab .s{width:1px;height:26px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}
.lab:hover .p,.lab.sel .p{background:rgba(240,163,94,.9);border-color:#fff;color:#111}
.geo{transform:translate(-50%,-50%);pointer-events:none;font:700 12px var(--fd);letter-spacing:.24em;text-transform:uppercase;color:#fff;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .9s;white-space:nowrap}
.geo.on{opacity:1}.geo.big{font-size:clamp(16px,1.6vw,24px);letter-spacing:.26em;color:rgba(255,255,255,.92)}
.geo.sea{font-style:italic;letter-spacing:.3em;color:#bfe9ff;font-weight:600}
.pin{transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .8s}.pin.on{opacity:1}
.pin .d{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(240,163,94,.3),0 0 22px var(--acc);margin:auto}
.pin .r{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid var(--acc);animation:ping 2s infinite}
.pin .n{position:absolute;left:18px;top:-9px;font:700 12px var(--fd);letter-spacing:.14em;white-space:nowrap;text-shadow:0 2px 10px #000}
.pin .n small{display:block;font:500 11px var(--f);letter-spacing:.06em;color:var(--acc2)}
@keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(5);opacity:0}}
#flash{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95),rgba(225,235,245,.85));transition:opacity .9s}
#vign{position:fixed;inset:0;z-index:6;pointer-events:none;background:linear-gradient(90deg,rgba(2,7,13,.82) 0%,rgba(2,7,13,.55) 26%,rgba(2,7,13,0) 52%),linear-gradient(0deg,rgba(2,7,13,.7) 0%,rgba(2,7,13,0) 30%),linear-gradient(180deg,rgba(2,7,13,.55) 0%,rgba(2,7,13,0) 14%),radial-gradient(130% 100% at 60% 45%,transparent 60%,rgba(0,0,0,.45));transition:opacity 1s}
#qr{position:fixed;right:clamp(20px,6vw,120px);top:50%;transform:translateY(-50%);z-index:8;text-align:center;opacity:0;pointer-events:none;transition:opacity .9s}
#qr.on{opacity:1;pointer-events:auto}
#qr img{width:min(260px,34vw);border-radius:18px;background:#fff;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#qr a{display:block;margin-top:14px;color:var(--acc2);font:600 13px var(--fm);text-decoration:none}
#tip{position:fixed;z-index:20;pointer-events:none;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.75);font:600 12px var(--f);opacity:0;transition:opacity .15s}
@media (max-width:760px){#lt{bottom:96px}#lt h2{font-size:30px}.bar{grid-template-columns:120px minmax(0,1fr) 40px}#panel{top:auto;bottom:86px;height:52vh;right:8px;left:8px;width:auto}.brand small{display:none}#hint{display:none}.tb .lb{display:none}}
.card{margin-top:18px;padding:14px 16px 10px;border-radius:14px;background:rgba(6,11,18,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);display:inline-block}
.loopb{transform:translate(-14px,-50%);display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .6s;pointer-events:none}.loopb.on{opacity:1}
.loopb .c{width:28px;height:28px;border-radius:50%;background:#fff;color:#0b1220;font:800 10px var(--fd);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(91,177,255,.85),0 6px 20px rgba(0,0,0,.4);position:relative;z-index:1}
.loopb .ring{position:absolute;left:0;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;border:2px solid #5bb1ff;animation:ping 2.2s infinite}
.loopb .t{background:rgba(6,11,18,.78);border:1px solid rgba(91,177,255,.45);border-radius:9px;padding:6px 10px;backdrop-filter:blur(6px)}
.loopb .t b{display:block;font:800 12px var(--fd);letter-spacing:.08em;color:#9fd0ff}.loopb .t span{display:block;font:500 11.5px var(--f);color:#dbe6f1;white-space:nowrap}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas><div id="labels"></div><div id="vign"></div><div id="flash"></div>
<div id="loader"><div class="b"><div class="lg">Live presentation</div><h1>MPW Gasification<br>Complex</h1><div class="bar"><i id="lbar"></i></div><div class="st" id="lst">Loading the Earth…</div><button id="start">Start</button></div></div>
<header id="top">
  <div class="brand"><svg viewBox="0 0 64 64"><path d="M32 6 54.5 19v26L32 58 9.5 45V19z" fill="none" stroke="#f0a35e" stroke-width="3"/><path d="M32 18 43 24.5v13L32 44 21 37.5v-13z" fill="#f0a35e" opacity=".9"/><circle cx="32" cy="31" r="4" fill="#05080d"/></svg>
    <span><b>MPW Gasification Complex</b><small>Hydrogen · Methanol · Jubail</small></span></div>
  <nav id="chaps"></nav>
  <div class="tb">
    <button class="ib" id="bExplore" title="Explore freely (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span class="lb">Explore</span></button>
    <button class="ib on" id="bLabels" title="Labels (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10l6 5-6 5H4z"/></svg><span class="lb">Labels</span></button>
    <button class="ib" id="bAuto" title="Autoplay (Space)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="lb">Auto</span></button>
    <button class="ib" id="bFull" title="Full screen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>
<section id="lt"></section>
<aside id="panel"><button class="ib x" id="pClose">✕</button><div id="pBody"></div></aside>
<div id="qr"><img src="assets/qr.png" alt="QR code of the digital twin"><a href="https://meesh81118-dotcom.github.io/mpw-digital-twin/" target="_blank" rel="noopener">meesh81118-dotcom.github.io/mpw-digital-twin</a></div>
<div id="hint">← → slides · click a unit · E explore · F full screen</div>
<footer id="bottom"><button class="arrow" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button><div id="dots"></div><div id="num">1 / 19</div><button class="arrow" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg></button></footer>
<div id="tip"></div>
<script type="module" src="main.js"></script>
</body>
</html>
